<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard | DBMS NEXUS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .table-panel {
            width: 100%;
            border-collapse: collapse;
            font-family: monospace;
            margin-top: 20px;
        }
        .table-panel th, .table-panel td {
            border: 1px solid var(--border);
            padding: 10px 14px;
            text-align: left;
        }
        .table-panel th {
            background: rgba(0, 234, 255, 0.1);
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="background-effects">
        <div class="grid-background"></div>
        <div class="orb orb-two"></div>
    </div>

    <header class="navbar">
        <a href="index.html" class="brand">
            <div class="brand-logo"><span>DB</span></div>
            <div class="brand-text"><strong>DBMS</strong><span>NEXUS</span></div>
        </a>
        <a href="index.html" class="secondary-button" style="min-height: 38px; padding: 0 16px;">STUDENT VIEW</a>
    </header>

    <main style="max-width: 1100px; margin: 120px auto 80px; padding: 0 5%;">
        <span class="topic-pill">ADMINISTRATIVE PROTOCOL</span>
        <h1 style="font-family: var(--font-tech); color: #fff; margin: 10px 0 20px;">ENROLLED STUDENTS PROGRESS MONITOR</h1>

        <div class="feature-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: var(--primary); font-size: 16px;">Active Student Database Records</h3>
                <button onclick="fetchStudents()" class="secondary-button" style="min-height: 32px; font-size: 11px;">↻ REFRESH DATA</button>
            </div>
            <table class="table-panel" id="studentTable">
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Email</th>
                        <th>Total XP</th>
                        <th>Ch 1</th>
                        <th>Ch 2</th>
                        <th>Ch 3</th>
                        <th>Ch 4</th>
                        <th>Last Active</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <tr><td colspan="8" style="text-align: center; color: var(--muted);">Loading student records...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAAy-3Xd5qTwtZKupFjjkzrquzWb3bMXqk",
          authDomain: "dbms-nexus.firebaseapp.com",
          projectId: "dbms-nexus",
          storageBucket: "dbms-nexus.firebasestorage.app",
          messagingSenderId: "305987976340",
          appId: "1:305987976340:web:d69d12dd17499bb0d18881",
          measurementId: "G-XQGCZ1WVEY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.fetchStudents = async function() {
            const tbody = document.getElementById("studentTableBody");
            try {
                const querySnap = await getDocs(collection(db, "students"));
                let html = "";
                querySnap.forEach(docSnap => {
                    const data = docSnap.data();
                    html += `
                        <tr>
                            <td><strong style="color: #fff;">${data.name || 'Anonymous'}</strong></td>
                            <td>${data.email}</td>
                            <td style="color: var(--accent);">${data.totalXP || 0} XP</td>
                            <td>${data.scores?.[1] || 0}%</td>
                            <td>${data.scores?.[2] || 0}%</td>
                            <td>${data.scores?.[3] || 0}%</td>
                            <td>${data.scores?.[4] || 0}%</td>
                            <td style="color: var(--muted); font-size: 10px;">${data.lastActive?.toDate ? data.lastActive.toDate().toLocaleDateString() : 'Active Today'}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html || '<tr><td colspan="8">No student records found.</td></tr>';
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="8" style="color: var(--danger);">Error loading data: ${err.message}</td></tr>`;
            }
        };

        fetchStudents();
    </script>
</body>
</html>
